services:
  postgres:
    image: postgres:17-alpine
    container_name: betopia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: betopia_attendance
      POSTGRES_USER: betopia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U betopia -d betopia_attendance"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
